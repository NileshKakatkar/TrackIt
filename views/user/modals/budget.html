<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Budget Modal</title>

    <style>
        /* Minimal styles just so modal works */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }
        .modal-card {
            background: #fff;
            padding: 20px;
            width: 400px;
            border-radius: 8px;
        }
        .form-group {
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
        }
        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<button onclick="openBudgetModal()">Set Budget</button>

<!-- ===== BUDGET MODAL ===== -->
<div class="modal-overlay" id="budgetModal" onclick="closeModal('budgetModal')">
    <div class="modal-card" onclick="event.stopPropagation()">
        <h3>Budget Configuration</h3>
        <p class="trans-msg">Set or update monthly limits for each category</p>

        <form id="budgetForm" data-type="budget" onsubmit="submitBudget(event)">
            
            <!-- hidden month -->
            <input type="hidden" name="month" id="budgetMonth">

            <div class="form-group budget-row">
                <label>Food</label>
                <input type="number" name="food" placeholder="0" step="1">
            </div>

            <div class="form-group budget-row">
                <label>Transport</label>
                <input type="number" name="transport" placeholder="0" step="1">
            </div>

            <div class="form-group budget-row">
                <label>Rent</label>
                <input type="number" name="rent" placeholder="0" step="1">
            </div>

            <div class="form-group budget-row">
                <label>Entertainment</label>
                <input type="number" name="entertainment" placeholder="0" step="1">
            </div>

            <div class="form-group budget-row">
                <label>Health</label>
                <input type="number" name="health" placeholder="0" step="1">
            </div>

            <div class="form-group budget-row">
                <label>Education</label>
                <input type="number" name="education" placeholder="0" step="1">
            </div>

            <div class="form-group budget-row">
                <label>Other</label>
                <input type="number" name="other" placeholder="0" step="1">
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-save">Save</button>
                <button type="button" class="btn-cancel" onclick="closeModal('budgetModal')">
                    Cancel
                </button>
            </div>
        </form>
    </div>
</div>

<!-- ===== JS ===== -->
<script>
function openBudgetModal() {
    // set current month (1–12)
    const currentMonth = new Date().getMonth() + 1;
    document.getElementById("budgetMonth").value = currentMonth;
    document.getElementById("budgetModal").style.display = "flex";
}

function closeModal(id) {
    document.getElementById(id).style.display = "none";
}

function submitBudget(event) {
    event.preventDefault();

    const form = document.getElementById("budgetForm");
    const formData = new FormData(form);

    const month = parseInt(formData.get("month"));
    const budgets = [];

    for (const [key, value] of formData.entries()) {
        if (key === "month") continue;

        const amount = parseInt(value);
        if (!isNaN(amount) && amount > 0) {
            budgets.push({
                category: capitalize(key),
                budget_amount: amount
            });
        }
    }

    if (budgets.length === 0) {
        alert("Please enter at least one budget");
        return;
    }

    fetch("/budget/update", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            month: month,
            budgets: budgets
        })
    })
    .then(res => {
        if (!res.ok) throw new Error();
        closeModal("budgetModal");
        location.reload();
    })
    .catch(() => {
        alert("Failed to save budget");
    });
}

function capitalize(str) {
    return str.charAt(0).toUpperCase() + str.slice(1);
}
</script>

</body>
</html>

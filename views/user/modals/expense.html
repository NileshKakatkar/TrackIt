<div class="modal-overlay" id="expenseModal" onclick="closeModal('expenseModal')">
    <div class="modal-card" onclick="event.stopPropagation()">
        <h3>Add Expense</h3>
        <p class="trans-msg " id="expenseMsg"></p>
        <form id="expenseForm" data-type="expense">
            <div class="form-group">
                <label>Description</label>
                <input type="text" name="description" placeholder="Dinner, Fuel, etc." required>
            </div>
            <div>
                <label for=""> Category</label>
                <select name="category" required>
                    {{ range $i, $cat := .categories }}
                    <option value="{{ $cat }}" {{ if eq $i 0 }}selected{{ end }}>
                        {{ $cat }}
                    </option>
                    {{ end }}
                </select>
            </div>
            <div class="form-group">
                <label>Amount</label>
                <input type="number" name="amount" step="0.01" placeholder="0.00" required>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn-save">Save</button>
                <button type="button" class="btn-cancel" onclick="closeModal('expenseModal')">Cancel</button>
            </div>
        </form>
    </div>
</div>
